<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Formulir Pendaftaran Seminar</title>
</head>
<body>
    <h1>Formulir Pendaftaran Seminar</h1>
    
    <form action="" method="post" enctype="multipart/form-data">
        <!-- Tabel 1: Data Peserta -->
        <table cellspacing="4" cellpadding="4" border="1" style="border-collapse:collapse; width: 100%;">
            <tr>
                <th colspan="2" style="text-align: left; background-color: #f2f2f2;">Data Peserta</th>
            </tr>
            <tr>
                <td style="width:32%;">
                    <label for="nama"><strong>Nama Lengkap</strong></label>
                </td>
                <td>
                    <input type="text" id="nama" name="nama" size="30" />
                </td>
            </tr>
            <tr>
                <td>
                    <label for="nim"><strong>NIM</strong></label>
                </td>
                <td>
                    <input type="text" id="nim" name="nim" size="30" />
                </td>
            </tr>
            <tr>
                <td>
                    <strong>Jenis Kelamin</strong>
                </td>
                <td>
                    <input type="radio" id="laki" name="jk" value="Laki-laki" /><label for="laki">Laki-laki</label>
                    <input type="radio" id="perempuan" name="jk" value="Perempuan" /><label for="perempuan">Perempuan</label>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="prodi"><strong>Program Studi</strong></label>
                </td>
                <td>
                    <select id="prodi" name="prodi">
                        <option>Informatika</option>
                        <option>Sistem Informasi</option>
                        <option>Teknik Industri</option>
                    </select>
                </td>
            </tr>
        </table>

        <br />

        <!-- Tabel 2: Pilihan Seminar -->
        <table cellspacing="4" cellpadding="4" border="1" style="border-collapse:collapse; width: 100%;">
            <tr>
                <th colspan="2" style="text-align: left; background-color: #f2f2f2;">Pilihan Seminar</th>
            </tr>
            <tr>
                <td style="width:32%;">
                    <strong>Jenis Tiket</strong>
                </td>
                <td>
                    <input type="radio" id="reguler" name="tiket" value="Reguler" /><label for="reguler">Reguler</label>
                    <input type="radio" id="vip" name="tiket" value="VIP" /><label for="vip">VIP</label>
                </td>
            </tr>
            <tr>
                <td style="vertical-align: top;">
                    <strong>Topik Seminar</strong>
                </td>
                <td>
                    <input type="checkbox" id="web" name="topik" value="Web Development" /><label for="web">Web Development</label><br />
                    <input type="checkbox" id="ds" name="topik" value="Data Science" /><label for="ds">Data Science</label><br />
                    <input type="checkbox" id="ai" name="topik" value="Artificial Intelligence" /><label for="ai">Artificial Intelligence</label>
                </td>
            </tr>
        </table>

        <br />

        <!-- Tabel 3: Informasi Tambahan -->
        <table cellspacing="4" cellpadding="4" border="1" style="border-collapse:collapse; width: 100%;">
            <tr>
                <th colspan="2" style="text-align: left; background-color: #f2f2f2;">Informasi Tambahan</th>
            </tr>
            <tr>
                <td style="width:32%; vertical-align: top;">
                    <label for="alasan"><strong>Alasan Mengikuti Seminar</strong></label>
                </td>
                <td>
                    <textarea id="alasan" name="alasan" rows="5" cols="30"></textarea>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="bukti"><strong>Bukti Pembayaran</strong></label>
                </td>
                <td>
                    <input type="file" id="bukti" name="bukti" />
                </td>
            </tr>
            <tr>
                <td colspan="2" style="text-align: center;">
                    <input type="submit" name="simpan" value="Simpan" />
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
