<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
"http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">

<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <title>Switch-Case: Menu Kantin</title>

    <script type="text/javascript">
        var sInput;

        sInput = prompt(
            "Pilih menu (N)asi Goreng, (M)ie Ayam, (B)akso, (E)s Teh",
            "N"
        );

        switch(sInput){
            case "N":
                alert("Anda memilih Nasi Goreng");
                break;

            case "M":
                alert("Anda memilih Mie Ayam");
                break;

            case "B":
                alert("Anda memilih Bakso");
                break;

            case "E":
                alert("Anda memilih Es Teh");
                break;

            default:
                alert("Menu tidak tersedia");
        }
    </script>
</head>

<body>
    <h1>Switch-Case: Menu Kantin</h1>

    <p>Reload halaman untuk mencoba lagi.</p>
</body>
</html>
